<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      href="{{ url_for('static', filename='img/fav/favicon.ico') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <title>{% block title %}YaCut{% endblock %}</title>
  </head>

  <body>
    <header class="pb-5">
      <nav
        class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm"
      >
        <div class="container">
          <ul class="nav nav-pills">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index_view') }}">
                Главная
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('files_view') }}">
                Загрузить файлы
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="fixed-bottom border-top bg-light text-center py-3">
      <p class="mb-0">Укоротитель ссылок YaCut</p>
    </footer>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
